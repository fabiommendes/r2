[project]
name = "r2-assistant"
version = "0.3.0"
description = "Sidekick TUI that follows Claude Code sessions running inside herdr."
readme = "README.md"
license = "MIT"
authors = [{ name = "Fábio Macêdo Mendes", email = "fabiomacedomendes@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0.3",
    "textual-image>=0.14.1",
    "textual[syntax]>=8.2.8",
]

[project.scripts]
r2 = "r2.app:main"
r2-notify = "r2.notify:main"
robin-notify = "r2.notify:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "r2"
module-root = "."

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.taskipy.tasks]
format = "ruff format . && ruff check --fix ."
lint = "ruff check . && ruff format --check . && mypy r2 && pyright r2 tests"
test = "pytest"
docs = "doc-zero build"
ci = "task lint && task test && task docs"
release = "task ci && uv build"

[dependency-groups]
dev = [
    "doc-zero>=0.2.3",
    "mypy>=2.4.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "taskipy>=1.14.1",
    "types-pyyaml>=6.0.12.20260906",
]
