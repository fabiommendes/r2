[project]
name = "r2-assistant"
version = "0.3.0"
description = "Sidekick TUI that follows Claude Code sessions running inside herdr."
readme = "README.md"
license = "MIT"
authors = [{ name = "Fábio Macêdo Mendes", email = "fabiomacedomendes@gmail.com" }]
requires-python = ">=3.13"
dependencies = ["pyyaml>=6.0.3"]

[project.optional-dependencies]
tui = [
    "textual-image>=0.14.1",
    "textual[syntax]>=8.2.8",
]

[project.scripts]
r2 = "r2.cli:main"
r2-notify = "r2.integrations.claude.notify:main"
robin-notify = "r2.integrations.claude.notify:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "r2"
module-root = "."

[tool.uv.sources]
r2-assistant = { workspace = true }

[tool.ruff]
line-length = 88
# Transitional: the old r2 modules are excluded until they are ported.
extend-exclude = [
    "tests/examples",
    "r2/__main__.,py", "r2/alias.py", "r2/cli.py", "r2/cli_tool.py",
    "r2/conf.py", "r2/console.py", "r2/edit.py", "r2/files.py", "r2/project",
    "r2/testing.py", "r2/utils.py",
    "tests/conftest.py", "tests/test_pyproject_tasks.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
exclude = [
    "^r2/(alias|cli|cli_tool|conf|console|edit|files|testing|utils)\\.py$",
    "^r2/project/",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
exclude = [
    "**/.venv", "tests/examples",
    "r2/alias.py", "r2/cli.py", "r2/cli_tool.py", "r2/conf.py", "r2/console.py",
    "r2/edit.py", "r2/files.py", "r2/project", "r2/testing.py", "r2/utils.py",
    "tests/conftest.py", "tests/test_pyproject_tasks.py",
]

[tool.pytest.ini_options]
# Transitional: the old integration tests need the typer CLI, ported next.
addopts = "--ignore=tests/test_pyproject_tasks.py"
norecursedirs = ["examples"]

[tool.taskipy.tasks]
format = "ruff format . && ruff check --fix ."
lint = "ruff check . && ruff format --check . && mypy r2 && pyright r2 tests"
test = "pytest"
docs = "doc-zero build"
ci = "task lint && task test && task docs"
release = "task ci && uv build"

[dependency-groups]
dev = [
    "r2-assistant[tui]",
    "doc-zero>=0.2.3",
    "mypy>=2.4.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "taskipy>=1.14.1",
    "types-pyyaml>=6.0.12.20260906",
]
