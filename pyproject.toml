[project]
name = "r2-assistant"
version = "0.2.0"
description = "A collection of tools to help managing a very opinionated Linux setup."
readme = "README.md"
authors = [
    { name = "Fábio Macêdo Mendes", email = "fabiomacedomendes@gmail.com" },
]
requires-python = ">=3.13"
dependencies = ["pydantic>=2.13.2", "rich>=14.2.0", "typer>=0.20.0"]

[project.scripts]
r2 = "r2.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "taskipy>=1.13"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "r2"
module-root = "."

[tool.hatch.build.targets.wheel]
packages = ["r2"]

[tool.taskipy.tasks]
test = "pytest tests"
