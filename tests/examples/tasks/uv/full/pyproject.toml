[project]
name = "full"
version = "0.1.0"
description = "Example project with test, build, and docs tasks defined."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
task = "full.taskrunner:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "full"
module-root = "."

[tool.taskipy.tasks]
test = "python -c \"import pathlib; pathlib.Path('TEST_RAN.txt').write_text('ok')\""
build = "python -c \"import pathlib; pathlib.Path('BUILD_RAN.txt').write_text('ok')\""
docs = "python -c \"import pathlib; pathlib.Path('DOCS_RAN.txt').write_text('ok')\""
