name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run task ci

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: uv sync
      - run: pnpm install --frozen-lockfile
      # The TypeScript types are generated from the API: fail on a stale copy.
      - run: pnpm run check-gen
      - run: pnpm run typecheck
      - run: pnpm exec biome check .
      - run: pnpm run build

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci, web]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
      - run: uv sync
      # The wheel carries the built UI in r2/web/static, so users need no Node.
      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: web
      - run: uv run task release
      - run: uv publish
